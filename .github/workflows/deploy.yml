name: Deploy to Beelink

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gha-kerf-${{ github.run_id }}

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BEELINK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H giaggi.tail66af38.ts.net >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run auto-pull on Beelink
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=15 \
              nicola@giaggi.tail66af38.ts.net \
              'bash /home/nicola/server/scripts/auto-pull.sh kerf-your-enthusiasm'
