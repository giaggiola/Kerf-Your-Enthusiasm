app = "kerf-your-enthusiasm"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  STEP_STORAGE_DIR = "/data/step-files"
  # Set DATABASE_URL as a secret pointing to a reachable PostgreSQL database.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Single instance for local STEP-file storage.
[deploy]
  strategy = "immediate"
